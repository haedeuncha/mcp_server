name: mcp_server CI

on:
  push:
    branches: [main]
    paths: ["mcp_server/**", ".github/workflows/mcp-server-ci.yml", ".github/workflows/_deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["mcp_server/**", ".github/workflows/mcp-server-ci.yml", ".github/workflows/_deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: mcp_server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp_server/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q server.py tests
      - name: Unit tests (Open-Meteo는 mock)
        run: python -m pytest -v

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t weather-mcp:ci .
      - name: Run container and check MCP endpoints
        run: |
          set -e
          docker run -d --name weather-mcp -p 8010:8010 weather-mcp:ci
          curl --fail -sS --retry 15 --retry-delay 2 --retry-all-errors http://127.0.0.1:8010/health
          echo
          curl --fail -sS -X POST http://127.0.0.1:8010/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | tee tools.json
          grep -q '"get_weather"' tools.json
      - name: Container logs on failure
        if: failure()
        run: docker logs weather-mcp || true

  deploy:
    needs: [test, docker-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      service: mcp_server
    secrets: inherit
