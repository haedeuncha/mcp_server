name: backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml", ".github/workflows/_deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml", ".github/workflows/_deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    # 실제 redis / postgres 를 서비스 컨테이너로 띄워 연결까지 확인한다
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weather" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://weather:weather@127.0.0.1:5432/weather
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app.py tests
      - name: Unit tests (MCP는 mock, DB는 postgres 서비스)
        run: python -m pytest -v
      - name: Health check with real redis / postgres
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          DATABASE_URL: postgresql://weather:weather@127.0.0.1:5432/weather
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app
          with TestClient(app.app) as c:
              body = c.get("/health").json()
          print(body)
          assert body["redis"] == "ok" and body["database"] == "ok", body
          PY

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t weather-backend:ci .

  deploy:
    needs: [test, docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy.yml
    with:
      service: backend
    secrets: inherit
